# Wspolne naglowki. nginx nie dziedziczy add_header do bloku location, ktory ma wlasne
# add_header, dlatego ten plik jest wlaczany w kazdym takim bloku.
# Pusta wartosc (domena docelowa) oznacza brak naglowka, patrz map w nginx.conf.
add_header X-Robots-Tag $robots_naglowek always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
