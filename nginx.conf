# nginx przed serwerem Node (Astro). Sam podaje pliki statyczne, przekierowania starych adresow
# i naglowki; strony, API panelu i wgrane zdjecia (/media/) bierze z Node na 127.0.0.1:4321.
#
# Indeksowana jest tylko domena docelowa: kazdy inny adres (demo, adres techniczny) dostaje
# X-Robots-Tag noindex, zeby nie konkurowal z phuprobud.pl.
map $host $robots_naglowek {
    default "noindex, nofollow";
    phuprobud.pl "";
}

server {
    listen 80;
    server_name _;
    root /app/dist/client;
    charset utf-8;
    # Przekierowania wzgledne: host i protokol ustala proxy przed kontenerem (Coolify).
    absolute_redirect off;
    server_tokens off;
    # Zdjecie z panelu to dwa JPEG-i (pelny do 4 MB i miniatura) w jednym zadaniu.
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/xml image/svg+xml;

    # Jeden adres kanoniczny, tak jak na starej stronie: bez www.
    if ($host = www.phuprobud.pl) { return 301 https://phuprobud.pl$request_uri; }

    include /etc/nginx/snippets/naglowki.conf;
    include /etc/nginx/snippets/przekierowania.conf;
    # Mapa starej strony (WordPress); pod tym adresem moze byc zgloszona w Google Search Console.
    location = /wp-sitemap.xml { return 301 /sitemap.xml; }

    # Pliki z hashem w nazwie (Astro) i katalog MapLibre z numerem wersji: cache na rok.
    location /_astro/ {
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Moduly ESM MapLibre musza miec typ JavaScript, inaczej przegladarka odrzuci import.
    location /vendor/ {
        types { application/javascript mjs; text/css css; text/plain txt; }
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* ^/(img|piktogramy|marki|marka|logo)/ {
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* ^/(dokumenty|ikony)/ { }
    location ~* ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|og\.jpg|robots\.txt)$ { }

    # Panel jest zbudowany statycznie; dane dociaga z API po zalogowaniu.
    location = /admin { return 301 /admin/; }
    location = /admin/ {
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "no-cache";
        try_files /admin/index.html =404;
    }

    # Reszta: strony renderowane ze zmianami z panelu, API panelu, wgrane zdjecia, mapa strony.
    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Strona 404 jest jedna, statyczna; odpowiedzi API (JSON) zostaja bez zmian.
        proxy_intercept_errors on;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
