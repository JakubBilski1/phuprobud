# Statyczna strona z Astro. Demo: X-Robots-Tag noindex, zeby nie konkurowala z phuprobud.pl.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Przekierowania wzgledne: host i protokol ustala proxy przed kontenerem (Coolify).
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/naglowki.conf;
    include /etc/nginx/snippets/przekierowania.conf;

    # Pliki z hashem w nazwie (Astro) i katalog MapLibre z numerem wersji: cache na rok.
    location /_astro/ {
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Moduly ESM MapLibre musza miec typ JavaScript, inaczej przegladarka odrzuci import.
    location /vendor/ {
        types { application/javascript mjs; text/css css; text/plain txt; }
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* ^/(img|piktogramy|marki|marka|logo)/ {
        include /etc/nginx/snippets/naglowki.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
